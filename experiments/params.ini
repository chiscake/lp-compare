# Fixed experiment parameters. Frozen before the main run; rationale in docs/decisions.md.
# Lookup order for per-class/per-method keys: "key.METHOD.CLASS", "key.CLASS", "key"
# (CLASS = ILL, S, M, L, XL; METHOD = dantzig, bland, ipm, dln).

# Wall-clock safety limit per solve, seconds. Iteration limits below are the primary (hardware-independent) limits.
timeout = 10
timeout.S = 10
timeout.M = 60
timeout.L = 300
timeout.XL = 600

# Timed runs per (task, method) and discarded warm-up runs before them.
repeats = 5
warmup = 1
# DLN on M/L/XL runs into its iteration limit (minutes of CPU per task); its time varies little between repeats.
# XL is optional in the protocol: a single timed run per method (Bland alone needs up to ~3 min per run there).
repeats.XL = 1
warmup.XL = 0
repeats.dln.M = 1
repeats.dln.L = 1
repeats.dln.XL = 1
warmup.dln.M = 0
warmup.dln.L = 0
warmup.dln.XL = 0

# Tableau simplex (both rules).
simplex.tol_d = 1e-9
simplex.tol_p = 1e-9
# Pivot limit = factor × (rows + columns of the standard form).
simplex.max_iter_factor = 50

# Mehrotra predictor-corrector.
ipm.tol = 1e-8
ipm.max_iter = 100
ipm.step_fraction = 0.995

# Diagonal linear network. λ and κ chosen on the train set (rule in docs/decisions.md).
dln.tol = 1e-8
dln.lambda = 0.003
dln.lambda.ILL = 0.005
dln.lambda.S = 0.005
dln.kappa = 30
dln.row_scale = true
dln.log_domain = false
dln.max_iter = 300000
dln.max_iter.ILL = 1000000
dln.max_iter.S = 1000000
dln.max_iter.M = 300000
dln.max_iter.L = 20000
dln.max_iter.XL = 5000

# λ study (lpbench grid): values of λ, both plain and log-domain DLN, κ = dln.kappa.
lambda_study.lambdas = 0.05,0.02,0.01,0.005,0.003,0.002,0.0014,0.001,0.0007,0.0005

# κ study (lpbench grid --kappas): values of κ at λ = dln.lambda.S, class S and the illustrative problem.
kappa_study.kappas = 1,3,10,30
