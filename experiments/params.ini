# Fixed experiment parameters. Values are frozen before the main run; see docs/decisions.md.
# Per-class overrides: "key.CLASS = value" (CLASS = ILL, S, M, L, XL).

# Wall-clock limit per solve, seconds.
timeout = 10
timeout.S = 10
timeout.M = 60
timeout.L = 300
timeout.XL = 600

# Timed runs per (task, method) and discarded warm-up runs before them.
repeats = 5
warmup = 1

# Tableau simplex (both rules).
simplex.tol_d = 1e-9
simplex.tol_p = 1e-9
# Pivot limit = factor × (rows + columns of the standard form).
simplex.max_iter_factor = 50

# Mehrotra predictor-corrector.
ipm.tol = 1e-8
ipm.max_iter = 100
ipm.step_fraction = 0.995

# Diagonal linear network.
dln.tol = 1e-8
dln.lambda = 0.01
dln.kappa = 30
dln.row_scale = true
dln.log_domain = false
dln.max_iter = 100000
dln.max_iter.S = 100000
dln.max_iter.M = 100000
dln.max_iter.L = 50000
dln.max_iter.XL = 20000
